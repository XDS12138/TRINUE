# 🔥 多验证集配置示例
# 
# 此文件展示了如何配置不同类型的验证集
# 基于实际的DATA目录结构编写
# 您可以根据自己的数据集修改此配置并合并到train.yaml中

validation_sets:
  
  # ==============================
  # 📸 全参考图像增强验证集
  # ==============================
  # 适用于有清晰GT图像的数据集
  # 实际数据结构：DATA/color_val/验证集名称/
  
  uieb_test:
    name: "UIEB_Test"  # 验证集名称（将用于日志和保存文件）
    type: "enhancement_with_reference"  # 验证类型
    data_root: "DATA/color_val/UIEB_test"  # 🔧 实际路径
    enabled: true  # 是否启用此验证集
    description: "UIEB测试集 - 水下图像增强全参考评估"
    metrics:  # 要计算的指标列表
      - "psnr"        # 峰值信噪比
      - "ssim"        # 结构相似性
      - "ciede2000"   # 色彩差异（CIE Delta E 2000）
      - "lpips"       # 学习感知图像补丁相似性
    save_images: 5  # 每个epoch保存多少张对比图
    folder_structure:  # 🔧 指定实际的文件夹名称
      input: "input"   # 输入图像文件夹名
      gt: "gt"         # GT图像文件夹名
    
  lsui_test:
    name: "LSUI_Test"
    type: "enhancement_with_reference"
    data_root: "DATA/color_val/LSUI_test"  # 🔧 实际路径
    enabled: true
    description: "LSUI测试集 - 水下图像增强全参考评估"
    metrics:
      - "psnr"
      - "ssim"
      - "ciede2000"
      - "lpips"
    save_images: 5
    folder_structure:
      input: "input"
      gt: "gt"

  # ==============================
  # 无参考图像增强验证集
  # ==============================
  # 适用于没有GT图像的真实数据集
  
  enhancement_noref_set1:
    name: "Real_Underwater_Set1"
    type: "enhancement_no_reference"
    data_root: "DATA/val/Real_Underwater_Set1"
    enabled: true
    description: "真实水下图像集1 - 无参考评估"
    metrics:  # 无参考指标
      - "uciqe"  # 水下图像色彩增强指标
      - "uiqm"   # 水下图像质量度量
      - "niqe"   # 自然图像质量评价器
    save_images: 5

  enhancement_noref_set2:
    name: "Real_Underwater_Set2"
    type: "enhancement_no_reference"
    data_root: "DATA/val/Real_Underwater_Set2"
    enabled: true
    description: "真实水下图像集2 - 无参考评估"
    metrics:
      - "uciqe"
      - "uiqm"
      - "niqe"
    save_images: 5

  # ==============================
  # 🏔️ 深度预测验证集
  # ==============================
  # 适用于有深度GT的数据集
  # 实际数据结构：DATA/train/depth_val/验证集名称/test/
  
  seathru_depth:
    name: "SeaThru_Depth"
    type: "depth_prediction"
    data_root: "DATA/train/depth_val/SeaThru_D3_D5_TestSet/test"  # 🔧 实际路径
    enabled: true
    description: "SeaThru D3&D5 深度预测测试集"
    metrics:  # 深度估计指标
      - "depth_mae"     # 平均绝对误差
      - "depth_rmse"    # 均方根误差
      - "depth_abs_rel" # 相对绝对误差
      - "depth_sq_rel"  # 相对平方误差
      - "depth_delta1"  # δ1准确率（阈值1.25）
      - "depth_delta2"  # δ2准确率（阈值1.25²）
      - "depth_delta3"  # δ3准确率（阈值1.25³）
    save_images: 5
    folder_structure:
      rgb: "rgb"        # RGB图像文件夹
      depth: "depth"    # 深度图像文件夹
    depth_format: "npy"  # 🔧 指定深度文件格式为numpy

  squid_depth:
    name: "SQUID_Depth"
    type: "depth_prediction"
    data_root: "DATA/train/depth_val/SQUID_Monocular_Left_Camera_TestSet/test"  # 🔧 实际路径
    enabled: true
    description: "SQUID单目深度预测测试集"
    metrics:
      - "depth_mae"
      - "depth_rmse"
      - "depth_abs_rel"
      - "depth_sq_rel"
      - "depth_delta1"
      - "depth_delta2"
      - "depth_delta3"
    save_images: 5
    folder_structure:
      rgb: "rgb"
      depth: "depth"
    depth_format: "npy"
  
  # ==============================
  # 如何添加新的验证集
  # ==============================
  # 
  # 1. 复制上面的任一配置块
  # 2. 修改以下字段：
  #    - name: 验证集的唯一名称
  #    - data_root: 您的验证集数据路径
  #    - description: 描述信息
  #    - metrics: 根据验证集类型选择合适的指标
  #    - enabled: 设置为true启用
  # 
  # 3. 确保数据目录结构正确：
  #    📸 对于enhancement_with_reference:
  #      data_root/
  #      ├── gt/           # GT图像
  #      └── input/        # 输入退化图像
  #    
  #    🌊 对于enhancement_no_reference:
  #      data_root/
  #      └── input/        # 输入图像（不需要gt文件夹）
  #    
  #    🏔️ 对于depth_prediction:
  #      data_root/
  #      ├── rgb/          # RGB图像
  #      └── depth/        # 深度图像（.npy格式）
  #
  # 4. 实际DATA目录结构：
  #    DATA/
  #    ├── color_val/         # 图像增强验证集
  #    │   ├── UIEB_test/
  #    │   │   ├── input/     # 输入图像
  #    │   │   └── gt/        # GT图像
  #    │   ├── LSUI_test/
  #    │   │   ├── input/
  #    │   │   └── gt/
  #    │   └── UIEB_challenging/
  #    │       ├── input/
  #    │       └── gt/
  #    └── train/depth_val/   # 深度预测验证集
  #        ├── SeaThru_D3_D5_TestSet/test/
  #        │   ├── rgb/       # RGB图像
  #        │   └── depth/     # 深度文件(.npy)
  #        └── SQUID_Monocular_Left_Camera_TestSet/test/
  #            ├── rgb/
  #            └── depth/

# ==============================
# 可视化配置（可选）
# ==============================
visualization:
  multi_validation:
    enabled: true  # 是否启用多验证集验证
    save_detailed_results: true  # 是否保存详细结果到CSV
    tensorboard_logging: true  # 是否记录到TensorBoard
    comparison_layout: "horizontal"  # 对比图布局：horizontal(水平) 或 vertical(垂直)
    save_individual_metrics: true  # 是否为每个验证集单独保存指标文件 